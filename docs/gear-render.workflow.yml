name: gear-render
# Renders new Wallet Gear mints (MP4 + PNG pinned to IPFS by the API, GLB stored privately).
# Auth = GitHub OIDC token checked by /api/gear/ingest. No secrets needed here.
on:
  schedule: [{ cron: '*/10 * * * *' }]
  workflow_dispatch:
  repository_dispatch: { types: [gear-render] }
permissions: { id-token: write, contents: read }
# Optional repo variable GEAR_SITE overrides the base (default https://myassets.gearup.wtf, falls back to mywally).
env: { GEAR_SITE: "${{ vars.GEAR_SITE }}" }
concurrency: { group: gear-render, cancel-in-progress: false }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: q
        run: |
          n=0
          for site in "${GEAR_SITE:-https://myassets.gearup.wtf}" https://mywally.gearup.wtf; do
            if j=$(curl -fsS --max-time 15 "$site/api/gear/pending"); then n=$(echo "$j" | jq '.pending | length'); break; fi
          done
          echo "pending=$n"; echo "n=$n" >> "$GITHUB_OUTPUT"
      - if: steps.q.outputs.n != '0'
        uses: actions/checkout@v4
      - if: steps.q.outputs.n != '0'
        uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - if: steps.q.outputs.n != '0'
        run: |
          npm ci --ignore-scripts
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg >/dev/null
          node scripts/gear-render/render.mjs
